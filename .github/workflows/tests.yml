name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    container: ghcr.io/home-assistant/home-assistant:2026.7.4
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile integration
        run: python3 -m compileall -q custom_components/haier
